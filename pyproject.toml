[project]
name = "practice-fastapi-tbd"
version = "0.1.0"
description = "Streamlit feedback analysis app powered by FastAPI and Gemini"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "google-genai>=2.30.1",
    "streamlit>=1.50.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
